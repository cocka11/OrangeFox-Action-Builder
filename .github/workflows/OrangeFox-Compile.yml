name: Build OrangeFox (garnet)

on: workflow_dispatch: inputs: MANIFEST_BRANCH: description: OrangeFox Manifest Branch required: true default: "12.1" DEVICE_TREE: description: Device Tree URL required: true DEVICE_TREE_BRANCH: description: Device Tree Branch required: true default: "android-14"

jobs: build: runs-on: ubuntu-22.04

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Install dependencies
    run: |
      sudo apt update
      sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
      gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
      libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
      python3 rsync bc ccache libssl-dev

  - name: Configure git
    run: |
      git config --global user.name "github-actions"
      git config --global user.email "actions@github.com"

  - name: Initialize OrangeFox source
    run: |
      mkdir OrangeFox
      cd OrangeFox
      repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_${{ inputs.MANIFEST_BRANCH }}
      repo sync -c --no-clone-bundle --no-tags -j$(nproc --all)

  - name: Clone device tree
    run: |
      cd OrangeFox
      git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} device/xiaomi/garnet

  - name: Build OrangeFox
    run: |
      cd OrangeFox
      source build/envsetup.sh

      export ALLOW_MISSING_DEPENDENCIES=true
      export FOX_AB_DEVICE=1
      export FOX_VIRTUAL_AB_DEVICE=1
      export FOX_RECOVERY_VENDOR_BOOT_PARTITION=1
      export FOX_NO_RECOVERY_PARTITION=1
      export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1

      bash build/tools/roomservice.py garnet || true

      . device/xiaomi/garnet/vendorsetup.sh
      lunch omni_garnet-eng

      mka adbd vendorbootimage -j$(nproc --all)

  - name: Upload artifact
    uses: actions/upload-artifact@v4
    with:
      name: OrangeFox-garnet
      path: OrangeFox/out/target/product/garnet/vendor_boot.img
